#:schema https://developers.openai.com/codex/config-schema.json

[mcp_servers.computer_system_bds]
command = "node"
args = ["tools/bds-mcp-server.mjs"]
cwd = "."
enabled = true
required = false
startup_timeout_sec = 15
tool_timeout_sec = 180
env_vars = ["BDS_HOME", "BDS_MCP_WORKDIR", "BDS_MCP_PORT", "BDS_MCP_WORLD", "WEB_COMPANION_AUTO_OPEN"]
enabled_tools = [
  "bds_status",
  "bds_start",
  "bds_stop",
  "bds_run_probe",
  "bds_run_command",
  "bds_get_logs",
  "bds_wait_for_log",
]
default_tools_approval_mode = "auto"
