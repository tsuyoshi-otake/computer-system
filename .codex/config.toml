#:schema https://developers.openai.com/codex/config-schema.json

[mcp_servers.computer_system_bds]
command = "node"
args = ["tools/bds-mcp-server.mjs"]
cwd = "."
enabled = true
required = false
startup_timeout_sec = 15
tool_timeout_sec = 180
env_vars = ["BDS_HOME", "BDS_MCP_WORKDIR", "BDS_MCP_PORT", "BDS_MCP_WORLD", "WEB_COMPANION_HOST", "WEB_COMPANION_PORT", "WEB_COMPANION_PUBLIC_HOST", "WEB_COMPANION_PUBLIC_ORIGIN", "WEB_COMPANION_AUTO_OPEN", "WEB_COMPANION_DEBUG_IGNORE_RANGE"]
enabled_tools = [
  "bds_status",
  "bds_start",
  "bds_provision_acceptance_fixture",
  "bds_stop",
  "bds_run_probe",
  "bds_run_command",
  "bds_execute_computer_command",
  "bds_get_logs",
  "bds_wait_for_log",
  "bds_list_computers",
  "bds_open_web_terminal",
  "bds_get_tui_screen",
  "bds_wait_for_tui_screen",
  "bds_send_tui_input",
  "bds_issue_web_handoff",
  "bds_wait_for_web_handoff",
]
default_tools_approval_mode = "auto"
